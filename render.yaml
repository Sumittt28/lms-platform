databases:
  - name: lms-postgres
    plan: free
    databaseName: lms
    user: lms

services:
  - type: web
    name: lms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: lms-postgres
          property: connectionString
      # Render generates a strong random value for this automatically -
      # we don't need to come up with or share a secret ourselves.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # These need real values only you have (Stripe/Vimeo dashboards).
      # sync: false means Render won't auto-fill them - you set them once
      # in the Render dashboard after the first deploy.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VIMEO_ACCESS_TOKEN
        sync: false
      # Set this to the Vercel frontend URL once both sides are deployed.
      - key: FRONTEND_URL
        sync: false
